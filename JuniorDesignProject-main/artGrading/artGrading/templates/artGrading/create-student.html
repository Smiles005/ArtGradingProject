{% extends "artGrading/layout.html" %} {% load static %} 

{% block CSS %}
    <link rel="stylesheet" href="{% static '/css/create-student-assignment.css' %}"> 
    {{ block.super }}
{% endblock %}

{% block body %}
<h1>Add Students</h1>
<div style="padding: 5px;"></div>

<!-- Add Student Form -->

    <form class="form-horizontal" action = "{% url 'addItem' 'student' %}" method = "POST">
        {% csrf_token %}
        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for ="StudentName">Student Name</label>
            <div class="col-sm-5">
                <input type="text" class="form-control" name="studentName" id="StudentName">
            </div>
        </div>
        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for ="email">Email</label>
            <div class="col-sm-5">
                <input type="email" class="form-control" name="email" id="email">
            </div>
        </div>
        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for ="studentID">Student ID#</label>
            <div class="col-sm-5">
                <input type="text" class="form-control" name="studentID" id="studentID" pattern = "[0-9]{7}" title="Enter numbers of student ID. ">
            </div>
        </div>
        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for="course">Course</label>
            <div class="col-sm-5">
                <select id="course" name="course">
                    <option value="selectCourse">Select a Course...</option>
                    {% for course in courses %}
                        <option value="{{ course.id }}">{{ course.name }} -- {{ course.semester }} {{ course.year }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-group row">
            <div class="col-sm-10">
                <button type="submit" class="btn btn-secondary">Save</button>

            </div>

        </div>

    </form>
{% endblock %}
