{% extends "artGrading/layout.html" %} {% load static %} 


{% block CSS %}
    <link rel="stylesheet" href="{% static '/css/create-project.css' %}">
    {{ block.super}}
{% endblock %}

{% block script %}
    <script src="{% static '/js/create-project.js' %}" defer></script>
{% endblock %}

{% block body %}
    <h1>Create a Project</h1>
    <div style="padding: 5px;"></div>
    
<!-- Add Student Form -->

    <form class="form-horizontal" method = "POST" action = "{% url 'addItem' 'project' %}">
        <div class="form-check">
            <input type="checkbox" id="isTemplate" name = "isTemplate">
            <label for="isTemplate">Template</label>
        </div>
        {% csrf_token %}
        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for="student">Student</label>
            <div class="col-sm-5">
                <select id="student" name="student">
                    <option value="selectStudent">Select a Student...</option>
                    {% for student in students %}
                        <option value="{{ student.id }}">{{ student.name }} </option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for="course">Course</label>
            <div class="col-sm-5">
                <select id="course" name="course">
                    <option value="selectCourse">Select a Course...</option>
                    {% for course in courses %}
                        <option value="{{ course.id }}">{{ course.name }} -- {{ course.semester }} {{ course.year }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for ="assignmentName">Assignment Name</label>
            <div class="col-sm-5">
                <select id="assignment" name="assignment">
                    <option value="selectAssignment">Select an Assignment...</option>
                    {% for assignment in assignments %}
                        <option class="{{ assignment.course.id }}" value="{{ assignment.id }}" style = "display: none">{{ assignment.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for = "numOfTables">Number of Tables:</label>
            <div class="col-sm-5">
                <input type="text" class="form-control" id="numOfTables" name = "numOfTables">
            </div>
        </div>
        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for ="numOfSliders">Number of Sliders</label>
            <div class="col-sm-5">
                <input type="text" class="form-control" id="numOfSliders" name = "numOfSliders"  title="Enter numbers of student ID. ">
            </div>
        </div>

        <!-- <div id='fieldContainer' class="form-group row">
            <div class="col-sm-10">
                <button  type="button" class="btn btn-primary" id="addRubricCategory">Add Rubric Category</button>
                <!-- Insert code to add input field 
            </div>
        </div> -->

        <!-- <div class="form-group row">
            <div class="col-sm-10">
                <button type="button" class="btn btn-primary">Add Rubric</button>
            </div>
        </div> --> 

        <div class="form-group row">
            <div class="col-sm-10">
                <button type="submit" class="btn btn-secondary">Save</button>
            </div>

        </div>


    </form>
{% endblock %}
